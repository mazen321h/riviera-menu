<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ريفيرا كافيه | Riviera Cafe Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f4ea; --surface:#fffaf0; --ink:#1f2a25; --muted:#6c756f; --green:#26352f; --green-ink:#f4eee0; --red:#b81f27; --line:#e3dac8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16201b;--surface:#1d2a24;--ink:#f1ebdd;--muted:#9aa59d;--green:#0f1814;--green-ink:#f1ebdd;--red:#ff6b6f;--line:#2e3d35}
}
:root[data-theme="dark"]{--bg:#16201b;--surface:#1d2a24;--ink:#f1ebdd;--muted:#9aa59d;--green:#0f1814;--green-ink:#f1ebdd;--red:#ff6b6f;--line:#2e3d35}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 118px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 16px 14px;background:#faf8eb;border-top:6px solid var(--red);border-bottom:1px solid #d9a3a6}
.tree{width:clamp(70px,24vw,110px);height:auto}
.logo{width:clamp(80px,27vw,125px);height:auto}
.mt{text-align:right;color:#1f2a25}.mt b{display:block;font-family:Georgia,serif;font-weight:400;font-size:clamp(22px,7vw,32px);letter-spacing:.04em}.mt span{color:#b81f27;font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 0}
.search{display:block;margin:0 16px 10px;width:calc(100% - 32px);padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.search:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 15px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-current="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
main{max-width:640px;margin:0 auto;padding:8px 16px 48px}
section{margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;background:var(--green);color:var(--green-ink);padding:11px 16px;border-radius:6px}
.sh h2{margin:0;font-size:20px;font-weight:600}
.sh span{font-size:13px;opacity:.8;direction:ltr}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line)}
.n b{display:block;font-weight:500;font-size:16px}
.n small{display:block;color:var(--muted);font-size:12.5px;direction:ltr;text-align:right}
.p{font-weight:600;color:var(--red);font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.p i{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 0;display:none}
</style>
</head>

const AR="٠١٢٣٤٥٦٧٨٩";
const num=s=>String(s).replace(/\d/g,d=>AR[d]);
const price=p=>typeof p==="string"?`${num(p.split("/")[0])} / ${num(p.split("/")[1])} <i>سنجل / دوبل</i>`:num(p);
const menu=document.getElementById("menu"),chips=document.getElementById("chips");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
MENU.forEach(([id,ar,en,items])=>{
  const s=document.createElement("section");s.id=id;
  s.innerHTML=`<div class="sh"><h2>${ar}</h2><span>${esc(en)}</span></div><ul>${items.map(([a,e,p])=>`<li data-s="${a} ${e}".toLowerCase()><div class="n"><b>${a}</b><small>${esc(e)}</small></div><div class="p">${price(p)}</div></li>`.replace('".toLowerCase()','"')).join("")}</ul>`;
  menu.appendChild(s);
  const c=document.createElement("button");c.className="chip";c.textContent=ar;c.dataset.t=id;
  c.onclick=()=>{document.getElementById("q").value="";filter("");document.getElementById(id).scrollIntoView()};
  chips.appendChild(c);
});
const secs=[...menu.children],cs=[...chips.children];
function setActive(id){cs.forEach(c=>{const on=c.dataset.t===id;c.setAttribute("aria-current",on);if(on){const r=c.getBoundingClientRect(),w=chips.getBoundingClientRect();if(r.left<w.left||r.right>w.right)chips.scrollTo({left:chips.scrollLeft+(r.left+r.right)/2-(w.left+w.right)/2,behavior:"smooth"})}})}
try{const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setActive(e.target.id)})},{rootMargin:"-130px 0px -70% 0px"});secs.forEach(s=>io.observe(s))}catch(e){}
function filter(v){
  v=v.trim().toLowerCase();let any=false;
  secs.forEach(s=>{let n=0;s.querySelectorAll("li").forEach(li=>{const m=!v||li.dataset.s.toLowerCase().includes(v);li.style.display=m?"":"none";if(m)n++});s.style.display=n?"":"none";if(n)any=true});
  document.getElementById("empty").style.display=any?"none":"block";
}
document.getElementById("q").addEventListener("input",e=>filter(e.target.value));
setActive("coffee");
